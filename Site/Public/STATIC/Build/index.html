<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spelling & Grammar Checker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
  <script src="./js/main.js" type="module"></script>
</head>

<body>
  <div class="site" id="web-app">
    <header id="masthed" class="site-header fixed-top sticky-header">
      <nav class="navbar-expand">
        <div class="site-logo">
          <a class="navbrand" href="index.html">
            <img src="./img/logo.svg" class="logo" width="85x85" alt="GrammarChecker">
          </a>
        </div>
      </nav>
    </header>

    <div class="container-xxl my-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">

          <section id="textEditorSection" class="upload-section position-relative border rounded bg-white">

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-5">
              <i class="bi bi-cloud-arrow-up display-4 text-primary"></i>

              <div class="mt-3">
                <h5 class="mb-1">Drag & Drop File</h5>
                <small class="text-muted">
                  Supported: .txt, .docx, .pdf, .doc
                </small>
              </div>

              <div class="d-flex justify-content-center gap-2 mt-3">
                <button type="button" id="browseFileButton" class="btn btn-primary">
                  <i class="bi bi-upload me-1"></i>
                  Browse
                </button>

                <button type="button" id="pasteClipboardButton" class="btn btn-outline-secondary">
                  <i class="bi bi-clipboard2-fill me-1"></i>
                  Paste
                </button>
              </div>
            </div>

            <!-- Editor -->
            <div class="p-3">
              <textarea id="textInput" name="textContent" class="form-control border-0 shadow-none"
                placeholder="Enter text or drop a file..."></textarea>
            </div>

            <!-- Hidden File Input -->
            <input type="file" id="hiddenFileInput" accept=".txt,.doc,.docx,.pdf" hidden>

            <!-- Drag Overlay -->
            <div id="dragDropOverlay"
              class="d-none position-absolute top-0 start-0 w-100 h-100 bg-primary bg-opacity-10 border border-primary border-2 rounded d-flex flex-column justify-content-center align-items-center"
              style="z-index:100">

              <i class="bi bi-file-earmark-arrow-up display-1 text-primary"></i>

              <div class="alert alert-primary mt-3 mb-0">
                Drop file here
              </div>
            </div>

          </section>

          <!-- Toolbar -->
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">

            <div class="btn-group">
              <button type="button" id="clearButton" class="btn btn-outline-secondary">
                Clear
              </button>

              <button type="button" id="formatButton" class="btn btn-outline-warning">
                Format
              </button>
            </div>

            <button type="button" id="checkButton" class="btn btn-success">
              Check
            </button>

          </div>

          <!-- Stats -->
          <div class="small text-muted mt-2">
            <span id="characterCount">0 chars</span>
            ·
            <span id="wordCount">0 words</span>
          </div>

          <!-- Results -->
          <div id="resultsPanel" class="mt-4 d-none">
            <div class="card border-success">

              <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span>Grammar Check Result</span>

                <span id="resultStatusBadge" class="badge bg-warning text-dark">
                  Processing
                </span>
              </div>

              <div id="resultsContent" class="card-body"></div>

            </div>
          </div>

        </div>
      </div>
    </div>
    <footer class="container-xxl">
      <div class="copy-right">
        <p>Burmese GrammarChecker tool © 2026</p>
      </div>
    </footer>
  </div>

  <!-- pdf.js is loaded at runtime from cdnjs by main.js (extractPdf), including its own worker -->
  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/progressbar.js@1.1.1/dist/progressbar.min.js"></script>

</body>

</html>
